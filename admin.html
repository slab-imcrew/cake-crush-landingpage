<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Cake Crush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      margin: 0;
      background: #f5f5f5;
      color: #333;
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .login-section {
      background: white;
      padding: 40px;
      border-radius: 12px;
      max-width: 400px;
      margin: 50px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .login-section h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 15px;
    }
    .field label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      background: #B8485E;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover { background: #a03c51; }

    .dashboard {
      display: none;
    }
    .dashboard.active {
      display: block;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    .table-wrapper {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #f9f9f9;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      font-size: 13px;
      color: #666;
      border-bottom: 1px solid #e0e0e0;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 14px;
    }

    tr:hover { background: #fafafa; }

    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .status.pending {
      background: #fff3cd;
      color: #856404;
    }

    .status.paid {
      background: #d4edda;
      color: #155724;
    }

    .status.cancelled {
      background: #f8d7da;
      color: #721c24;
    }

    .select-status {
      padding: 6px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stat-card .number {
      font-size: 32px;
      font-weight: 700;
      color: #B8485E;
      margin-bottom: 5px;
    }

    .stat-card .label {
      font-size: 13px;
      color: #999;
    }

    .logout-btn {
      background: #666;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .logout-btn:hover { background: #555; }

    .error {
      color: #d32f2f;
      margin-bottom: 15px;
      padding: 10px;
      background: #ffebee;
      border-radius: 4px;
    }

    .success {
      color: #388e3c;
      margin-bottom: 15px;
      padding: 10px;
      background: #e8f5e9;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="login-section" id="loginSection">
      <h1>🔐 Admin Cake Crush</h1>
      <div id="loginError" class="error" style="display: none;"></div>
      <div class="field">
        <label for="adminPassword">Mật khẩu</label>
        <input type="password" id="adminPassword" placeholder="Nhập mật khẩu">
      </div>
      <button class="btn" onclick="loginAdmin()">Đăng nhập</button>
    </div>

    <div class="dashboard" id="dashboard">
      <div class="header">
        <h1>📊 Dashboard - Đơn hàng 20/10</h1>
        <button class="logout-btn" onclick="logout()">Đăng xuất</button>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="number" id="totalCount">0</div>
          <div class="label">Tổng đơn</div>
        </div>
        <div class="stat-card">
          <div class="number" id="paidCount">0</div>
          <div class="label">Đã thanh toán</div>
        </div>
        <div class="stat-card">
          <div class="number" id="pendingCount">0</div>
          <div class="label">Chờ thanh toán</div>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Họ tên</th>
              <th>Số điện thoại</th>
              <th>Sản phẩm</th>
              <th>SL</th>
              <th>Ngày nhận</th>
              <th>Ghi chú</th>
              <th>Trạng thái</th>
              <th>Thao tác</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="9" style="text-align: center; color: #999;">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function loginAdmin() {
      const password = document.getElementById('adminPassword').value;

      fetch(`/api/admin/check-password?password=${password}`)
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            localStorage.setItem('adminPassword', password);
            loadDashboard();
          } else {
            document.getElementById('loginError').textContent = 'Mật khẩu sai!';
            document.getElementById('loginError').style.display = 'block';
          }
        });
    }

    function loadDashboard() {
      const password = localStorage.getItem('adminPassword');

      fetch(`/api/admin/submissions?password=${password}`)
        .then(r => r.json())
        .then(data => {
          if (!data.error) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');

            renderTable(data.data);
            updateStats(data.data);
          }
        });
    }

    function renderTable(submissions) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = submissions.map((sub, i) => `
        <tr>
          <td>${sub.id}</td>
          <td><strong>${sub.name}</strong></td>
          <td>${sub.phone}</td>
          <td>${sub.product}</td>
          <td>${sub.quantity}</td>
          <td>${sub.date}</td>
          <td><small>${sub.note || '—'}</small></td>
          <td>
            <select class="select-status" onchange="updateStatus(${sub.id}, this.value)">
              <option value="pending" ${sub.payment_status === 'pending' ? 'selected' : ''}>Chờ TT</option>
              <option value="paid" ${sub.payment_status === 'paid' ? 'selected' : ''}>Đã TT</option>
              <option value="cancelled" ${sub.payment_status === 'cancelled' ? 'selected' : ''}>Hủy</option>
            </select>
          </td>
          <td>
            <button class="logout-btn" style="background: #1976d2; font-size: 12px;" onclick="viewQR('${sub.name}', '${sub.phone}')">QR</button>
          </td>
        </tr>
      `).join('');
    }

    function updateStats(submissions) {
      document.getElementById('totalCount').textContent = submissions.length;
      document.getElementById('paidCount').textContent = submissions.filter(s => s.payment_status === 'paid').length;
      document.getElementById('pendingCount').textContent = submissions.filter(s => s.payment_status === 'pending').length;
    }

    function updateStatus(id, status) {
      const password = localStorage.getItem('adminPassword');

      fetch(`/api/admin/submissions/${id}?password=${password}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ payment_status: status })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          loadDashboard();
        }
      });
    }

    function viewQR(name, phone) {
      fetch('/api/generate-qr', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone, amount: 100000 })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          window.open(data.imageUrl, 'QR_Code', 'width=400,height=500');
        }
      });
    }

    function logout() {
      localStorage.removeItem('adminPassword');
      location.reload();
    }

    // Check login on load
    if (localStorage.getItem('adminPassword')) {
      loadDashboard();
    }
  </script>
</body>
</html>
